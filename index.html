<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My E-Commerce Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: white;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #0056b3;
        }

        .products {
            padding: 40px;
            text-align: center;
        }

        .products h2 {
            margin-bottom: 30px;
            font-size: 30px;
        }

        .product-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .product-card {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        footer {
            margin-top: 40px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>My E-Commerce Store</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/orders">Orders</a>
        <a href="/admin">Admin</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to Our Store</h2>

    <p>
        Find the products you love at the best prices.
    </p>

    <a href="#products" class="btn">Shop Now</a>
</section>

<section class="products" id="products">

    <h2>Our Products</h2>

    <div class="product-container">

        <div class="product-card">
            <img src="{{ url_for('static', filename='images/headphones.jpg') }}"
                 alt="Headphones">

            <h3>Headphones</h3>

            <p class="price">₹3000</p>

            <a href="/cart" class="btn">View Cart</a>
        </div>


        <div class="product-card">
            <img src="{{ url_for('static', filename='images/laptop.jpg') }}"
                 alt="Laptop">

            <h3>Laptop</h3>

            <p class="price">₹55000</p>

            <a href="/cart" class="btn">View Cart</a>
        </div>


        <div class="product-card">
            <img src="{{ url_for('static', filename='images/phone.jpg') }}"
                 alt="Mobile Phone">

            <h3>Mobile Phone</h3>

            <p class="price">₹25000</p>

            <a href="/cart" class="btn">View Cart</a>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 My E-Commerce Store</p>
</footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
